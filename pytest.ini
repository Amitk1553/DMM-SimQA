[pytest]
pythonpath = src
testpaths = tests
addopts = --strict-markers --html=reports/test_report.html --self-contained-html --cov=dmm_simqa --cov-report=term-missing --cov-fail-under=90
filterwarnings = error
markers =
    smoke: basic instrument readiness
    functional: command and measurement behavior
    boundary: measurement and configuration boundaries
    negative: invalid operations and recovery
    regression: repeatable behavioral regression checks
    integration: loopback TCP and lifecycle tests
